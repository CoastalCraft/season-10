<!DOCTYPE html>
<html lang="en">

<head>
    <title>uNmINeD</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- OpenLayers  -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">


    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom markers -->
    <script type="text/javascript" src="custom.markers.js"></script>

    <!-- uNmINeD JS and CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">
        
    <link rel="stylesheet" href="map-navigation.css?v=20261106">
    <link rel="stylesheet" href="player-bases.css?v=20261102-positive-radii">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <script src="player-bases.config.js"></script>
    <script src="marker-sheet.js?v=20261102-positive-radii"></script>
    <script src="player-bases.js?v=20261102-positive-radii"></script>
    <script src="spawn-town.js"></script>

</head>

<body>
    <nav class="map-navigation" aria-label="Map navigation"><a href="/">← CoastalCraft</a><span>Season 10</span><div class="map-dimensions" role="group" aria-label="Dimension"><a href="/season-10/" aria-current="page">Overworld</a><a href="/season-10/nether/">Nether</a></div></nav>
    <div id="map"></div>
    <aside id="player-bases" class="bases-panel" aria-label="Markers layer">
        <button type="button" id="bases-collapse" class="bases-collapse" aria-expanded="true" aria-controls="bases-content">Markers <span id="bases-chevron" aria-hidden="true">−</span></button>
        <div id="bases-content">
        <div class="bases-heading">
            <label><input type="checkbox" id="bases-toggle" checked> Show markers (<span id="bases-count">0</span>)</label>
            <button type="button" id="bases-refresh" class="bases-refresh">Refresh</button>
        </div>
        <p id="bases-status" class="bases-status" role="status" aria-live="polite">Loading markers…</p>
        <label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" id="spawn-town-toggle" checked style="accent-color:#174f42"> Spawn Town · 500 blocks</label>
        <div id="bases-list" class="marker-groups" aria-label="Marker groups"></div>
        <p class="bases-help">Select a marker to center the map. Coordinates are X, Z.</p>
        </div>
    </aside>

    <script type="text/javascript">

        document.title = UnminedMapProperties.worldName + " - Season 10 Overworld";

        if (UnminedCustomMarkers && UnminedCustomMarkers.isEnabled && UnminedCustomMarkers.markers) {
            UnminedMapProperties.markers = UnminedMapProperties.markers.concat(UnminedCustomMarkers.markers);
        }
        
        if (UnminedPlayers && UnminedPlayers.length > 0) {
            UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
        }

        const mapElement = document.getElementById('map');
        const unmined = new Unmined(mapElement, UnminedMapProperties, UnminedRegions);
        const playerBases = mountPlayerBases(unmined, window.CoastalPlayerBases);
        const spawnTown = mountSpawnTown(unmined);


    </script>
</body>

</html>
